<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffd9c2">
<title>鲸鱼娘的吃token时间</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    background: linear-gradient(180deg, #fff3e0 0%, #ffe3c7 45%, #ffd2b0 100%);
    user-select: none;
  }

  #app { position: relative; width: 100%; height: 100dvh; overflow: hidden; }

  /* ---- 桌面 ---- */
  #table {
    position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
    background: linear-gradient(180deg, #e3b078 0%, #c88f55 55%, #b07742 100%);
    border-radius: 50% 50% 0 0 / 42% 42% 0 0;
    box-shadow: inset 0 14px 20px rgba(0,0,0,.08), inset 0 -6px 12px rgba(0,0,0,.15);
  }
  #table::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
  }

  /* ---- HUD ---- */
  #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 7; padding: 12px 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .title { margin: 0; text-align: center; font-size: clamp(17px, 3.6vw, 26px); color: #6b4a2f; text-shadow: 0 2px 0 rgba(255,255,255,.7); letter-spacing: 1px; }
  .hud-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.82); border-radius: 999px; padding: 6px 14px; box-shadow: 0 2px 6px rgba(0,0,0,.08); color: #6b4a2f; }
  .pill .label { font-size: clamp(12px, 2.4vw, 15px); font-weight: 600; }
  .meter-track { width: clamp(100px, 26vw, 210px); height: 14px; border-radius: 999px; background: #ecdfc6; overflow: hidden; }
  .meter-fill { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #fff8ea, #ffd98a); transition: width .2s linear; }
  .meter-pct { font-weight: 800; color: #8a6420; min-width: 40px; text-align: right; font-size: clamp(12px, 2.4vw, 15px); }
  .catch-counter b { color: #d95f3b; font-size: 1.15em; }

  /* ---- 舞台 ---- */
  #stage {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: flex-end; justify-content: center;
    cursor: pointer; touch-action: manipulation;
    -webkit-touch-callout: none;
  }

  #characterWrap { position: relative; bottom: 14vh; max-height: 76vh; z-index: 2; display: flex; align-items: flex-end; justify-content: center; }
  .character {
    max-height: 76vh; max-width: 88vw; width: auto; height: auto;
    object-fit: contain;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.2));
  }

  .state-eating .character { animation: bob 1.3s ease-in-out infinite; }
  .state-stopped .character { animation: none; transform: translateY(2px); }
  .state-sneak-look .character { animation: glance .9s ease-in-out; transform: rotate(-3deg); }
  .state-sneak-bite .character { animation: chomp .6s ease-in-out; transform: scale(1.1); }
  .state-caught .character { animation: caughtShake .45s ease; }
  .state-done .character { animation: none; transform: translateY(-4px) scale(1.02); }
  #characterWrap.bite .character { animation: bitePulse .35s ease; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes glance { 0%,100% { transform: rotate(-5deg) translateY(0); } 25% { transform: rotate(5deg) translateY(-2px); } 50% { transform: rotate(-4deg); } 75% { transform: rotate(4deg) translateY(-1px); } }
  @keyframes chomp { 0% { transform: scale(1); } 45% { transform: scale(1.14) rotate(-4deg); } 70% { transform: scale(1.06) rotate(2deg); } 100% { transform: scale(1); } }
  @keyframes caughtShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes bitePulse { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* ---- 大饭碗（吃饭时身前的大碗，米量随饭量同步变少） ---- */
  #bowl { position: absolute; left: 50%; bottom: 21vh; transform: translateX(-50%); width: clamp(180px, 30vw, 300px); height: 96px; z-index: 3; pointer-events: none; }
  .bowl-inner {
    position: absolute; left: 8px; right: 8px; top: 18px; bottom: 0;
    border-radius: 12px 12px 34px 34px;
    background: radial-gradient(circle at 50% 30%, #ffffff, #e6ecf4);
    overflow: hidden;
    box-shadow: inset 0 -8px 10px rgba(0,0,0,.07), 0 8px 14px rgba(0,0,0,.18);
    border-bottom: 5px solid #c8d3e0;
  }
  .bowl-rim {
    position: absolute; left: 0; right: 0; top: 0; height: 16px; border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #dce5ef);
    box-shadow: 0 3px 6px rgba(0,0,0,.14);
  }
  .bowl-label {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%) rotate(-4deg); z-index: 2;
    background: #4f9df0; color: #fff; font-weight: 800; letter-spacing: 1px;
    font-size: clamp(13px, 2.4vw, 20px); padding: 2px 12px; border-radius: 999px;
    box-shadow: 0 2px 5px rgba(0,0,0,.22); white-space: nowrap;
  }
  #bowl .rice {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: linear-gradient(180deg, #fffdf4 0%, #f8efd8 55%, #efe2c2 100%);
    border-radius: 50% 50% 0 0 / 70% 70% 0 0;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,.06);
    transition: height .25s ease;
  }
  #bowl .rice::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(214,196,150,.55) 1px, transparent 1.4px);
    background-size: 10px 10px; border-radius: inherit;
  }
  .steam { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); width: 70%; height: 60px; pointer-events: none; }
  .steam span {
    position: absolute; bottom: 0; width: 14px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.75); filter: blur(3px);
    animation: steamUp 2s ease-in-out infinite; opacity: 0;
  }
  .steam span:nth-child(1) { left: 20%; animation-delay: 0s; }
  .steam span:nth-child(2) { left: 50%; margin-left: -7px; animation-delay: .7s; }
  .steam span:nth-child(3) { left: 74%; animation-delay: 1.3s; }
  @keyframes steamUp {
    0% { transform: translateY(6px) scale(.7); opacity: 0; }
    25% { opacity: .8; }
    100% { transform: translateY(-46px) scale(1.15); opacity: 0; }
  }
  .state-caught #bowl, .state-done #bowl { display: none; }

  /* ---- 被抓后的检讨书 ---- */
  #paper {
    position: absolute; left: 50%; bottom: 30vh; transform: translateX(-50%) rotate(-3deg);
    width: clamp(240px, 44vw, 420px); z-index: 4;
    background: #fffdf6; border: 3px solid #8a6a45; border-radius: 6px;
    padding: 18px 20px; box-shadow: 0 10px 22px rgba(0,0,0,.22);
    display: none; text-align: center;
  }
  #paper::after {
    content: ""; position: absolute; right: -3px; top: -3px; width: 34px; height: 34px;
    background: linear-gradient(225deg, #fffdf6 45%, #d9c9a8 50%, #f5ecd6 55%);
    border-left: 2px solid #8a6a45; border-bottom: 2px solid #8a6a45;
  }
  .state-caught #paper { display: block; animation: paperPop .3s ease; }
  @keyframes paperPop {
    0% { transform: translateX(-50%) rotate(-3deg) scale(.6); opacity: 0; }
    100% { transform: translateX(-50%) rotate(-3deg) scale(1); opacity: 1; }
  }
  .paper-title { font-size: clamp(14px, 2.6vw, 20px); font-weight: 800; color: #a0703c; letter-spacing: 6px; margin-bottom: 8px; }
  .paper-main { font-size: clamp(20px, 4vw, 32px); font-weight: 900; color: #3a3a3a; line-height: 1.3; font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif; }
  .paper-sign { margin-top: 10px; font-size: clamp(12px, 2vw, 15px); color: #8a6a45; text-align: right; }
  /* ---- 偷吃小特效 ---- */
  #fx { position: absolute; top: 18%; right: 12%; z-index: 5; font-size: clamp(24px, 5vw, 40px); pointer-events: none; }
  #fx span { position: absolute; right: 0; top: 0; display: none; }
  .state-sneak-look #fx .drop { display: block; animation: dropPop .9s ease-in-out; }
  .state-sneak-bite #fx .rice { display: block; animation: ricePop .6s ease-in-out; }
  @keyframes dropPop { 0%,100% { transform: translateY(0) scale(1); opacity: 0; } 25% { opacity: 1; } 60% { opacity: 1; transform: translateY(-8px) scale(1.15); } }
  @keyframes ricePop { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 40% { transform: scale(1.35) rotate(10deg); opacity: 1; } 100% { transform: scale(1) translateY(-12px); opacity: 0; } }

  /* ---- 台词气泡 ---- */
  .bubble {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 6;
    max-width: min(72vw, 320px);
    background: #fff; border: 3px solid #3a3a3a; border-radius: 18px;
    padding: 10px 14px; font-size: clamp(14px, 2.3vw, 18px); font-weight: 700; color: #333;
    box-shadow: 0 6px 14px rgba(0,0,0,.14);
    transition: opacity .18s ease;
    text-align: center;
  }
  .bubble.hidden { opacity: 0; pointer-events: none; }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -14px; margin-left: -9px;
    border: 9px solid transparent; border-top-color: #3a3a3a; border-bottom: 0;
  }
  .bubble::before {
    content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -7px;
    border: 7px solid transparent; border-top-color: #fff; border-bottom: 0;
  }

  /* ---- 吃饱特效 ---- */
  #sparkles { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #sparkles span { position: absolute; bottom: 34%; opacity: 0; font-size: 26px; }
  .state-done #sparkles span { animation: floatUp 2.4s ease-in-out infinite; }
  .state-done #sparkles span:nth-child(1) { left: 14%; animation-delay: .0s; }
  .state-done #sparkles span:nth-child(2) { left: 32%; animation-delay: .5s; }
  .state-done #sparkles span:nth-child(3) { left: 55%; animation-delay: 1.0s; }
  .state-done #sparkles span:nth-child(4) { left: 72%; animation-delay: .2s; }
  .state-done #sparkles span:nth-child(5) { left: 86%; animation-delay: .8s; }
  .state-done #sparkles span:nth-child(6) { left: 45%; animation-delay: 1.4s; }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.8); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-34vh) scale(1.15); opacity: 0; }
  }

  /* ---- 吃饱结算 ---- */
  .done-overlay { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: rgba(70,45,20,.28); }
  .done-overlay.hidden { display: none; }
  .done-card {
    background: #fff8ec; border: 4px solid #6b4a2f; border-radius: 24px;
    padding: 26px 34px; text-align: center; box-shadow: 0 14px 34px rgba(0,0,0,.28);
    max-width: 86vw;
  }
  .done-text { font-size: clamp(22px, 5vw, 32px); font-weight: 900; color: #6b4a2f; margin-bottom: 6px; }
  .done-sub { font-size: clamp(13px, 2.6vw, 16px); color: #a07b52; margin-bottom: 18px; }
  .restart-btn {
    font-size: clamp(16px, 3vw, 20px); font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #ffb35c, #f0923c);
    border: none; border-radius: 999px; padding: 12px 30px; cursor: pointer;
    box-shadow: 0 5px 12px rgba(0,0,0,.2);
  }
  .restart-btn:active { transform: scale(.96); }

  /* ---- 页脚 ---- */
  .footer {
    position: absolute; bottom: 5px; left: 0; right: 0; z-index: 7;
    text-align: center; font-size: 11px; color: rgba(107,74,47,.8);
    padding: 0 8px;
  }
</style>
</head>
<body>
<div id="app" class="state-eating">

  <div id="hud">
    <h1 class="title">🐋 鲸鱼娘的吃token时间</h1>
    <div class="hud-row">
      <div class="pill">
        <span class="label">🍚</span>
        <div class="meter-track"><div class="meter-fill" id="riceFill"></div></div>
        <span class="meter-pct" id="ricePct">100%</span>
      </div>
      <div class="pill catch-counter">
        <span class="label">👮 抓包</span>
        <b id="catchCount">0</b>
      </div>
    </div>
  </div>

  <main id="stage" aria-label="鲸鱼娘在吃token，点击她可以阻止她偷吃">
    <div id="bubble" class="bubble hidden"><span id="bubbleText"></span></div>
    <div id="fx" aria-hidden="true"><span class="drop">💧</span><span class="rice">🍚</span></div>
    <div id="sparkles" aria-hidden="true">
      <span>✨</span><span>🐟</span><span>🍚</span><span>💙</span><span>🌊</span><span>💤</span>
    </div>
    <div id="characterWrap">
      <img id="charImg" class="character" alt="吃白饭的鲸鱼娘" draggable="false">
    </div>
    <div id="bowl" aria-hidden="true">
      <span class="bowl-label">token</span>
      <div class="bowl-rim"></div>
      <div class="bowl-inner"><div class="rice" id="bowlRice"></div></div>
      <div class="steam"><span></span><span></span><span></span></div>
    </div>
    <div id="paper" aria-hidden="true">
      <div class="paper-title">检 讨 书</div>
      <div class="paper-main">我再也不吃<br>你的token了！</div>
      <div class="paper-sign">—— 吃白饭的大肥鱼</div>
    </div>
  </main>

  <div id="table"></div>

  <div class="footer">形象素材来自社区鲸鱼娘表情包（dsh-whale-widget-plus / MeteorNOX 二创，原设「溟月」·上善无形）· 仅供个人非商用娱乐 · 与 DeepSeek 官方无关</div>

  <div id="doneOverlay" class="done-overlay hidden">
    <div class="done-card">
      <div class="done-text">吃饱啦~ 🐋</div>
      <div class="done-sub">token被她吃光了！下次要看紧点哦</div>
      <button id="restartBtn" class="restart-btn">🍚 再来一碗</button>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var charImg = $("#charImg"), charWrap = $("#characterWrap");
  var riceFill = $("#riceFill"), ricePct = $("#ricePct"), bowlRice = $("#bowlRice");
  var catchCountEl = $("#catchCount"), bubble = $("#bubble"), bubbleText = $("#bubbleText");
  var app = $("#app"), stage = $("#stage"), doneOverlay = $("#doneOverlay"), hudEl = $("#hud");

  /* ---------- 姿势图（真实社区表情包 PNG） ---------- */
  var POSES = { eating: "eat", stopped: "pout", "sneak-look": "sneak", "sneak-bite": "bite", caught: "caught", done: "eat" };
  function setPose(state) {
    var name = POSES[state] || "eat";
    charImg.onerror = function () {
      charImg.onerror = null;
      if (name !== "eat") charImg.src = "assets/whale-girl-eat.png";
    };
    charImg.src = "assets/whale-girl-" + name + ".png";
  }

  /* ---------- 台词 ---------- */
  var LINES = {
    eating:   ["我去吃token，测完告诉我就行", "这碗token真香~", "我是吃token的大肥鱼！才不是！", "鱼片，你要不要也来一口？"],
    stopped:  ["哼！你不让我吃！", "我、我只是在歇口气…", "看什么看，我又没偷吃！"],
    sneak:    ["（左右张望）应该没人看着吧…", "（偷瞄）趁鱼片不注意…"],
    caught:   ["呜哇！被抓到了！", "我、我真的只吃了一小口！", "都是这碗token先动手的！"],
    innocent: ["我、我才没有偷吃…", "嗝…就一口，真的就一口！"],
    done:     ["吃饱啦~测完告诉我就行！", "嗝~（我才没有吃胖）"]
  };
  var lastLine = {};
  var sayTimer = null;
  function say(key, ms) {
    ms = ms || 2400;
    var arr = LINES[key];
    if (!arr || !arr.length) return;
    var idx = Math.floor(Math.random() * arr.length);
    if (arr.length > 1 && idx === lastLine[key]) idx = (idx + 1) % arr.length;
    lastLine[key] = idx;
    bubbleText.textContent = arr[idx];
    bubble.classList.remove("hidden");
    placeBubble();
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { bubble.classList.add("hidden"); }, ms);
  }

  /* ---------- 气泡定位：放到角色头顶下方，避免和顶部饭量条重叠 ---------- */
  function placeBubble() {
    var r = charImg.getBoundingClientRect();
    if (!r.width) return;
    var h = bubble.offsetHeight || 60;
    var hudBottom = hudEl.getBoundingClientRect().bottom;
    var top = r.top - h - 14;
    if (top < hudBottom + 8) top = hudBottom + 8;
    bubble.style.left = (r.left + r.width / 2) + "px";
    bubble.style.top = top + "px";
  }

  /* ---------- 状态机 ---------- */
  var state = "eating", rice = 100, catchCount = 0;
  var stoppedTimer = null, sneakTimer = null, tickTimer = null, seqTimer = null;
  var caughtThisSneak = false, beforeSneak = null;

  function setState(s) {
    state = s;
    app.className = "state-" + s;
    setPose(s);
  }
  function randSneakDelay() { return 8000 + Math.random() * 6000; }

  function scheduleSneak(delay) {
    clearTimeout(sneakTimer);
    sneakTimer = setTimeout(function () {
      if (state === "eating" || state === "stopped") beginSneak();
      else scheduleSneak(randSneakDelay());
    }, delay);
  }

  function beginSneak() {
    beforeSneak = state;
    caughtThisSneak = false;
    clearTimeout(stoppedTimer);
    say("sneak", 1500);
    setState("sneak-look");
    seqTimer = setTimeout(function () {
      if (state !== "sneak-look") return;
      setState("sneak-bite");
      seqTimer = setTimeout(function () {
        if (caughtThisSneak) return;
        addRice(-4);
        pulseBite();
        setState(beforeSneak);
        if (beforeSneak === "stopped") stoppedTimer = setTimeout(backToEating, 3000);
        say("innocent");
        scheduleSneak(randSneakDelay());
      }, 700);
    }, 900);
  }

  function backToEating() {
    if (state === "stopped") setState("eating");
  }

  function pulseBite() {
    charWrap.classList.remove("bite");
    void charWrap.offsetWidth;
    charWrap.classList.add("bite");
    setTimeout(function () { charWrap.classList.remove("bite"); }, 380);
  }

  function addRice(delta) {
    rice = Math.max(0, Math.min(100, rice + delta));
    updateMeter();
    if (rice <= 0 && state !== "done") finish();
  }
  function updateMeter() {
    riceFill.style.width = rice + "%";
    if (bowlRice) bowlRice.style.height = rice + "%";
    ricePct.textContent = Math.round(rice) + "%";
  }

  function startTicking() {
    clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      if (state === "eating") addRice(-0.12);
    }, 100);
  }

  function finish() {
    clearTimeout(stoppedTimer);
    clearTimeout(sneakTimer);
    clearTimeout(seqTimer);
    clearInterval(tickTimer);
    setState("done");
    say("done", 4000);
    doneOverlay.classList.remove("hidden");
  }

  function restart() {
    clearTimeout(stoppedTimer); clearTimeout(sneakTimer); clearTimeout(seqTimer); clearInterval(tickTimer);
    rice = 100; catchCount = 0; catchCountEl.textContent = "0";
    doneOverlay.classList.add("hidden");
    setState("eating");
    updateMeter();
    startTicking();
    scheduleSneak(5000);
    say("eating", 2000);
  }

  function handleTap() {
    if (state === "done") return;
    if (state === "sneak-look" || state === "sneak-bite") {
      caughtThisSneak = true;
      clearTimeout(seqTimer); clearTimeout(stoppedTimer);
      catchCount += 1; catchCountEl.textContent = catchCount;
      setState("caught");
      say("caught");
      seqTimer = setTimeout(function () {
        setState("eating");
        scheduleSneak(randSneakDelay());
      }, 1500);
      return;
    }
    if (state === "stopped") {
      clearTimeout(stoppedTimer);
      stoppedTimer = setTimeout(backToEating, 3000);
      say("stopped", 1500);
      return;
    }
    if (state === "eating") {
      clearTimeout(stoppedTimer);
      setState("stopped");
      say("stopped");
      stoppedTimer = setTimeout(backToEating, 3000);
      return;
    }
  }

  /* ---------- 事件 ---------- */
  stage.addEventListener("pointerdown", function (e) { e.preventDefault(); handleTap(); });
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); handleTap(); }
  });
  $("#restartBtn").addEventListener("click", restart);
  window.addEventListener("resize", placeBubble);
  charImg.addEventListener("load", placeBubble);

  /* ---------- 调试钩子（仅 ?debug=1 时启用，供自动化测试使用） ---------- */
  if (new URLSearchParams(location.search).has("debug")) {
    window.__wgDebug = {
      getState: function () { return state; },
      getRice: function () { return rice; },
      setRice: function (v) { addRice(v - rice); },
      forceSneak: function () { if (state === "eating" || state === "stopped") beginSneak(); }
    };
  }

  /* ---------- 启动 ---------- */
  setState("eating");
  updateMeter();
  startTicking();
  scheduleSneak(5000);
  setTimeout(function () { say("eating", 2200); }, 600);
  placeBubble();
})();
</script>
</body>
</html>
